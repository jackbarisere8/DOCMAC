name: docmac_app
description: A Flutter starter app scaffold for chat, calls, contacts, profile, and settings.
publish_to: 'none'
version: 1.0.1+2

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^4.0.0
  firebase_auth: ^6.0.0
  cloud_firestore: ^6.0.0
  # 13.2.0+ supports Android Gradle Plugin 9 Built-in Kotlin.
  firebase_storage: ^13.4.5
  firebase_messaging: ^16.0.0
  flutter_riverpod: ^2.5.0
  google_fonts: ^6.3.3
  go_router: ^14.0.0
  image_picker: ^1.0.0
  cached_network_image: ^3.0.0
  intl: ^0.19.0
  uuid: ^4.0.0
  flutter_local_notifications: ^17.0.0
  permission_handler: ^11.0.0
  path_provider: ^2.1.5
  provider: ^6.1.2
  record: ^7.1.1
  shared_preferences: ^2.2.3
  hive: ^2.0.0
  hive_flutter: ^1.0.0
  iconly: ^1.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
