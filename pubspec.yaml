name: docmac_app
description: A Flutter starter app scaffold for chat, calls, contacts, profile, and settings.
publish_to: 'none'
version: 1.0.3+4

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^4.0.0
  firebase_auth: ^6.0.0
  cloud_firestore: ^6.0.0
  flutter_riverpod: ^2.5.0
  google_fonts: ^6.3.3
  go_router: ^14.0.0
  image_picker: ^1.0.0
  intl: ^0.19.0
  path_provider: ^2.1.5
  provider: ^6.1.2
  record: ^7.1.1
  shared_preferences: ^2.2.3
  # Supplies the font assets used by core/ui/docmac_iconly.dart.
  iconly: ^1.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
