name: docmac_app
description: A Flutter starter app scaffold for chat, calls, contacts, profile, and settings.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^3.1.0
  firebase_auth: ^5.0.0
  cloud_firestore: ^5.0.0
  firebase_storage: ^12.0.0
  firebase_messaging: ^15.0.0
  flutter_riverpod: ^2.5.0
  go_router: ^14.0.0
  image_picker: ^1.0.0
  cached_network_image: ^3.0.0
  intl: ^0.19.0
  uuid: ^4.0.0
  flutter_local_notifications: ^17.0.0
  emoji_picker_flutter: ^2.0.0
  file_picker: ^8.0.0
  permission_handler: ^11.0.0
  hive: ^2.0.0
  hive_flutter: ^1.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
