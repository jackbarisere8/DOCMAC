name: docmac_app
description: A Flutter starter app scaffold for chat, calls, contacts, profile, and settings.
publish_to: 'none'
version: 1.0.4+5

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^4.15.1
  firebase_auth: ^6.7.1
  cloud_firestore: ^6.0.0
  cloud_functions: ^6.5.1
  firebase_crashlytics: ^5.4.1
  firebase_analytics: ^12.6.1
  flutter_riverpod: ^2.5.0
  google_fonts: ^6.3.3
  go_router: ^14.0.0
  image_picker: ^1.0.0
  intl: ^0.19.0
  http: ^1.2.0
  path_provider: ^2.1.5
  provider: ^6.1.2
  record: ^7.1.1
  shared_preferences: ^2.2.3
  crypto: ^3.0.6
  flutter_svg: ^2.1.0
  # Supplies the font assets used by core/ui/docmac_iconly.dart.
  iconly: ^1.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    # Flutter does not bundle assets in nested directories automatically.
    - assets/icons/chat/
    - assets/icons/community/free_icon_pack/
    - assets/icons/community/smoooth/outline/
  fonts:
    - family: DocmacWordmark
      fonts:
        - asset: assets/fonts/Unbounded-ExtraBold.ttf
          weight: 800
