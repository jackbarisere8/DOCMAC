name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flutter:
    name: Flutter analyze and test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Design Lab smoke test
        run: >-
          flutter test
          --dart-define=DOCMAC_DESIGN_LAB=true
          test/design_lab_smoke_test.dart

  android:
    name: Android debug build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '9.1.0'

      - name: Prepare Android build
        run: |
          set -euo pipefail

          # Gradle properties carry a Windows-local JDK path; it does not
          # exist on the Linux runner.
          sed -i '/^[[:space:]]*org\.gradle\.java\.home=/d' android/gradle.properties
          sed -i 's/-Xmx8G/-Xmx4G/' android/gradle.properties

          ANDROID_SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          {
            echo "flutter.sdk=$FLUTTER_ROOT"
            if [ -n "$ANDROID_SDK" ]; then
              echo "sdk.dir=$ANDROID_SDK"
            fi
          } > android/local.properties

          # The wrapper JAR and scripts are gitignored in this repository.
          if [ ! -x android/gradlew ]; then
            (cd android && gradle wrapper --gradle-version 9.1.0)
          else
            chmod +x android/gradlew
          fi

      - name: Build debug APK
        run: |
          set -euo pipefail
          flutter pub get
          flutter build apk --debug

      - name: Verify debug APK
        run: |
          set -euo pipefail
          test -f build/app/outputs/flutter-apk/app-debug.apk
          ls -lh build/app/outputs/flutter-apk/app-debug.apk

  functions:
    name: Cloud Functions check and test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: functions
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Syntax check
        run: npm run check

      - name: Test
        run: npm test

  rules:
    name: Firestore rules test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: rules-test
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: rules-test/package-lock.json

      - name: Cache Firestore emulator
        uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ runner.os }}-${{ hashFiles('firebase.json') }}

      - name: Install dependencies
        run: npm ci

      - name: Install Firebase CLI
        run: npm install --global firebase-tools

      - name: Test security rules
        run: npm test
